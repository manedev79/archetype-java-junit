# Release the archetype to Maven Central and create a GitHub release.
# Nothing is pushed to GitHub before the artifacts are published, so a failed
# deployment leaves no tag behind for a version that never shipped.

trigger:
- none

pr:
- none

pool:
  vmImage: ubuntu-latest

parameters:
  - name: RELEASE_VERSION
    type: string
    displayName: Version to release, e.g. 1.0.0

variables:
  - group: 'oss-secrets'
  # Hosted agents provide one JAVA_HOME_<version>_X64 variable per installed JDK.
  - name: JDK_HOME
    value: $(JAVA_HOME_25_X64)
  # Holds the local repository and the Maven distribution downloaded by the wrapper.
  - name: MAVEN_USER_HOME
    value: $(Pipeline.Workspace)/.m2
  - name: MAVEN_OPTS
    value: '-Xmx3072m'
  - name: MAVEN_CLI_ARGS
    value: '--batch-mode --no-transfer-progress -Dmaven.repo.local=$(MAVEN_USER_HOME)/repository'

steps:

- checkout: self
  persistCredentials: 'true'
  clean: 'true'

- task: Cache@2
  displayName: Cache Maven repository and wrapper
  inputs:
    key: 'maven | "$(Agent.OS)" | .mvn/wrapper/maven-wrapper.properties | **/pom.xml'
    restoreKeys: |
      maven | "$(Agent.OS)"
    path: $(MAVEN_USER_HOME)

- script: |
    ./mvnw $(MAVEN_CLI_ARGS) versions:set -DnewVersion=${{ parameters.RELEASE_VERSION }} -DgenerateBackupPoms=false
    ./mvnw $(MAVEN_CLI_ARGS) -Prelease-docs process-resources
  displayName: Set project version to ${{ parameters.RELEASE_VERSION }} and update README
  env:
    JAVA_HOME: $(JDK_HOME)
    MAVEN_USER_HOME: $(MAVEN_USER_HOME)
    MAVEN_OPTS: $(MAVEN_OPTS)

- script: |
    git config --global user.email "ci@dev.azure.com"
    git config --global user.name "[CI]"
    git add pom.xml README.md
    git commit -m "[skip ci] Set version to ${{ parameters.RELEASE_VERSION }}"
    git tag ${{ parameters.RELEASE_VERSION }}
  displayName: Commit release version and tag it locally

- task: DownloadSecureFile@1
  name: gpgkey
  displayName: 'Download secret signing key'
  inputs:
    secureFile: 'secret_signing_key_F5CE35A802DF35C1.gpg'

# Builds, runs the integration tests, signs and waits until Maven Central has published the release.
- script: ./mvnw $(MAVEN_CLI_ARGS) deploy -Prelease --settings .azure-pipelines/settings.xml -Dgpg.keyFilePath=$(gpgkey.secureFilePath)
  displayName: Deploy ${{ parameters.RELEASE_VERSION }} to Maven Central
  env:
    JAVA_HOME: $(JDK_HOME)
    MAVEN_USER_HOME: $(MAVEN_USER_HOME)
    MAVEN_OPTS: $(MAVEN_OPTS)
    CENTRAL_TOKEN_USERNAME: $(CENTRAL_TOKEN_USERNAME)
    CENTRAL_TOKEN_PASSWORD: $(CENTRAL_TOKEN_PASSWORD)
    MAVEN_GPG_PASSPHRASE: $(GPG_PASSPHRASE)

- script: git push --atomic origin HEAD:$(Build.SourceBranchName) ${{ parameters.RELEASE_VERSION }}
  displayName: Push release commit and tag

# gh picks up GITHUB_TOKEN from the environment, no login needed.
# The token must be a GitHub PAT with write access to this repository's contents.
- script: |
    if [[ "${{ parameters.RELEASE_VERSION }}" == *-* ]]; then PRERELEASE=--prerelease; fi
    gh release create ${{ parameters.RELEASE_VERSION }} --verify-tag --generate-notes ${PRERELEASE:-}
  displayName: Create Github Release
  env:
    GITHUB_TOKEN: $(GITHUB_TOKEN)
