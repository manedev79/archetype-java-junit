# Build the archetype and run its integration tests with the Maven Wrapper.

trigger:
- main

pr:
- main

pool:
  vmImage: ubuntu-latest

variables:
  # Hosted agents provide one JAVA_HOME_<version>_X64 variable per installed JDK.
  JDK_HOME: $(JAVA_HOME_25_X64)
  # Holds the local repository and the Maven distribution downloaded by the wrapper.
  MAVEN_USER_HOME: $(Pipeline.Workspace)/.m2
  MAVEN_OPTS: '-Xmx3072m'
  MAVEN_CLI_ARGS: '--batch-mode --no-transfer-progress -Dmaven.repo.local=$(MAVEN_USER_HOME)/repository'

steps:

- checkout: self
  clean: 'true'

- task: Cache@2
  displayName: Cache Maven repository and wrapper
  inputs:
    key: 'maven | "$(Agent.OS)" | .mvn/wrapper/maven-wrapper.properties | **/pom.xml'
    restoreKeys: |
      maven | "$(Agent.OS)"
    path: $(MAVEN_USER_HOME)

- script: ./mvnw $(MAVEN_CLI_ARGS) verify
  displayName: Build and test
  env:
    JAVA_HOME: $(JDK_HOME)
    MAVEN_USER_HOME: $(MAVEN_USER_HOME)
    MAVEN_OPTS: $(MAVEN_OPTS)
